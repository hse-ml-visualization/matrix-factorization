<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />

  <body>

    <footer class="app-footer">
      <code>python3 -m http.server 8080</code> &mdash; запустить локально в папке matrix-lab
